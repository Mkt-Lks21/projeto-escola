services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_BACKEND_API_URL: ${VITE_BACKEND_API_URL}
    depends_on:
      - delphi-proxy
      - chat-proxy
      - admin-proxy
    ports:
      - "${WEB_HOST_PORT:-8080}:80"
    restart: unless-stopped

  delphi-proxy:
    build:
      context: .
      dockerfile: services/delphi-proxy/Dockerfile
    env_file:
      - ${PROJECT_ENV_FILE:-./deploy/vps.env}
    expose:
      - "8787"
    restart: unless-stopped

  chat-proxy:
    build:
      context: .
      dockerfile: services/chat-proxy/Dockerfile
    env_file:
      - ${PROJECT_ENV_FILE:-./deploy/vps.env}
    expose:
      - "8789"
    restart: unless-stopped

  admin-proxy:
    build:
      context: .
      dockerfile: services/admin-proxy/Dockerfile
    env_file:
      - ${PROJECT_ENV_FILE:-./deploy/vps.env}
    expose:
      - "8788"
    restart: unless-stopped

  chart-processor:
    build:
      context: ./services/chart-processor
      dockerfile: Dockerfile
    env_file:
      - ${PROJECT_ENV_FILE:-./deploy/vps.env}
    expose:
      - "8000"
    restart: unless-stopped
