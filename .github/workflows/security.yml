name: Security Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  app-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm run security:audit

      - name: Validate lockfile drift
        run: git diff --exit-code package-lock.json

      - name: Setup detect-secrets
        run: |
          python -m pip install --upgrade pip
          pip install detect-secrets

      - name: Scan repo secrets
        run: detect-secrets scan --baseline .secrets.baseline

  rls-audit:
    if: ${{ vars.SUPABASE_DB_URL != '' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ vars.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Run RLS SQL audit
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f scripts/check-rls.sql

